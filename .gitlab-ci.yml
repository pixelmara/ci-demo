stages:
  - test
#  - build
#  - deploy

# ---- Кейс 2: юнит-тесты при каждом коммите ----
unit-tests:
  stage: test
  image: python:3.12-slim
  before_script:
    - pip install -r requirements.txt -r requirements-dev.txt
  script:
    - pytest --junitxml=report.xml
  artifacts:
    when: always
    reports:
      junit: report.xml

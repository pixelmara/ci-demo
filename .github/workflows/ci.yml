name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Получить код
        uses: actions/checkout@v4

      - name: Установить Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Установить зависимости
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Проверка кода (flake8)
        run: flake8 .

      - name: Юнит-тесты
        run: pytest

      - name: Сборка Docker-образа
        run: docker build -t ci-demo:${{ github.sha }} .

  # ---- Кейс 6: уведомления ----
  notify:
    needs: build
    if: always()
    runs-on: ubuntu-latest
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      STATUS: ${{ needs.build.result }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Письмо на e-mail
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "CI ${{ needs.build.result }}: ${{ github.repository }}"
          to: ${{ secrets.MAIL_USERNAME }}
          from: GitHub Actions <${{ secrets.MAIL_USERNAME }}>
          body: |
            Пайплайн: ${{ github.workflow }}
            Статус: ${{ needs.build.result }}
            Ветка: ${{ github.ref_name }}
            Коммит: ${{ github.sha }}
            Автор: ${{ github.actor }}
            Подробности: ${{ env.RUN_URL }}

      - name: Сообщение в Slack (если задан SLACK_WEBHOOK_URL)
        if: env.SLACK_WEBHOOK_URL != ''
        run: |
          if [ "$STATUS" = "success" ]; then ICON=":white_check_mark:"; else ICON=":x:"; fi
          curl -sS -X POST -H 'Content-type: application/json' \
            --data "{\"text\":\"$ICON CI *$STATUS* — ${{ github.repository }} (${{ github.ref_name }})\n$RUN_URL\"}" \
            "$SLACK_WEBHOOK_URL"

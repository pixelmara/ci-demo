version: 2.1

jobs:
  build-and-test:
    docker:
      - image: cimg/python:3.12
    steps:
      - checkout
      - run:
          name: Установить зависимости
          command: pip install -r requirements.txt -r requirements-dev.txt
      - run:
          name: Тесты
          command: pytest

  deploy-heroku:
    docker:
      - image: cimg/base:stable
    steps:
      - checkout
      - run:
          name: Деплой на Heroku
          command: |
            git fetch --unshallow || true
            git push --force \
              https://heroku:$HEROKU_API_KEY@git.heroku.com/$HEROKU_APP_NAME.git \
              HEAD:refs/heads/main

workflows:
  build-test-deploy:
    jobs:
      - build-and-test
      - deploy-heroku:
          requires:
            - build-and-test
          filters:
            branches:
              only: main

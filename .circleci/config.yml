version: 2.1

jobs:
  build-and-test:
    docker:
      - image: cimg/python:3.12
    steps:
      - checkout
      - run:
          name: Установить зависимости
          command: pip install -r requirements.txt -r requirements-dev.txt
      - run:
          name: Тесты
          command: pytest
      - run:
          name: Собрать сайт
          command: python build_site.py
      - persist_to_workspace:
          root: .
          paths:
            - public


  deploy-pages:
    docker:
      - image: cimg/base:stable
    steps:
      - attach_workspace:
          at: .
      - run:
          name: Деплой на GitHub Pages
          command: |
            cd public
            git init -q -b gh-pages
            git config user.name "CircleCI"
            git config user.email "ci@example.com"
            git add -A
            git commit -q -m "Deploy ${CIRCLE_SHA1} [skip ci]"
            git push --force \
              "https://x-access-token:${GH_TOKEN}@github.com/${CIRCLE_PROJECT_USERNAME}/${CIRCLE_PROJECT_REPONAME}.git" \
              gh-pages

workflows:
  build-test-deploy:
    jobs:
      - build-and-test
      - deploy-pages:
          requires:
            - build-and-test
          filters:
            branches:
              only: main
